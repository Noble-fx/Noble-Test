        <stop offset="0" stop-color="#ecd08f"/>
        <stop offset="1" stop-color="#b9893c"/>
      </linearGradient>
      <g id="logo">
        <!-- candlestick -->
        <g fill="url(#gold)" stroke="url(#gold)" stroke-width="1.6">
          <line x1="125" y1="40" x2="125" y2="66"/><rect x="121.5" y="46" width="7" height="13" stroke="none"/>

    <!-- Daftar link -->
    <ul class="links">
      <li>
        <a class="link" href="https://t.me/NobleFX2026" target="_blank" rel="noopener noreferrer">
          <span class="thumb" aria-hidden="true">
            <svg viewBox="22 22 156 156"><use href="#logo"/></svg>
          </span>
          <span class="label">Grup Free Signal &amp; Education</span>
          <button class="menu" type="button"
                  aria-label="Bagikan link Grup Free Signal &amp; Education"

          </button>
